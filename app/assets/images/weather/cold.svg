<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="halo">
      <stop offset="0.35" stop-color="#7CC4FF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#7CC4FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <g id="arm">
      <line x1="64" y1="64" x2="64" y2="12"/>
      <polyline points="52,20 64,32 76,20"/>
      <polyline points="55,38 64,47 73,38"/>
    </g>
  </defs>
  <circle cx="64" cy="64" r="62" fill="url(#halo)"/>
  <g stroke="url(#ice)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <use href="#arm"/>
    <use href="#arm" transform="rotate(60 64 64)"/>
    <use href="#arm" transform="rotate(120 64 64)"/>
    <use href="#arm" transform="rotate(180 64 64)"/>
    <use href="#arm" transform="rotate(240 64 64)"/>
    <use href="#arm" transform="rotate(300 64 64)"/>
